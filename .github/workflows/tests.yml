# The userland tests, on every push and pull request: the fuzzer, the
# packet-by-packet and COBALT comparisons with Linux's sch_cake, and the
# plugin wrapper's and the repository signing checks' unit tests. The VM
# suites (robustness.sh, features.sh) need the test bench and are run by
# hand. The packages workflow runs these first too, and builds only if they
# pass.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fuzz.sh, 3 seeds of a million packets
        run: for seed in 1 2 3; do test/fuzz.sh 1000000 $seed; done

  sch-cake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the Linux sources once, for all three comparisons: raw.githubusercontent.com
      # rate-limits repeated downloads. The commit is LINUX_COMMIT of the scripts
      - name: Linux sch_cake.c and pkt_sched.h
        run: |
          raw=https://raw.githubusercontent.com/torvalds/linux/700b4c6c70d6a36e6878c5ea092c4877da3f10d8
          mkdir -p "$RUNNER_TEMP/linux"
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/linux/sch_cake.c" "$raw/net/sched/sch_cake.c"
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/linux/pkt_sched.h" "$raw/include/uapi/linux/pkt_sched.h"
          echo "SCH_CAKE=$RUNNER_TEMP/linux/sch_cake.c" >> "$GITHUB_ENV"
          echo "PKT_SCHED=$RUNNER_TEMP/linux/pkt_sched.h" >> "$GITHUB_ENV"
      - name: sched-diff.sh, lockstep
        run: test/sched-diff.sh
      - name: sched-diff.sh, link clock
        run: test/sched-diff.sh link
      - name: cobalt-diff.sh
        run: test/cobalt-diff.sh

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: wrapper unit tests
        run: python3 test/plugin-lib.py
      - name: signing server checks
        run: python3 test/sign-check.py
      - name: syntax of the shell, Python and PHP sources
        run: |
          for f in $(git ls-files '*.sh'); do sh -n "$f"; done
          git ls-files '*.py' | xargs python3 -c 'import ast, sys
          for f in sys.argv[1:]: ast.parse(open(f).read(), f)'
          for f in $(git ls-files '*.php' '*.inc'); do php -l "$f" >/dev/null; done
