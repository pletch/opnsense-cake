# What the release packages are built from (plugin/ci-build.sh): the
# OPNsense series and its package ABI, and the opnsense/src and
# opnsense/plugins commits on its stable branches. Change them
# deliberately, in their own commit.
SERIES=26.7
ABI=FreeBSD:15:amd64
SRC_COMMIT=01510f095c2ba12ced4959a102403c261c95b2a4
PLUGINS_COMMIT=65b08c8a6df73292b5dfdb77c6b5d2c71734d3ee
# The OPNsense kernel set whose dummynet.ko cake-kmod records as the one it
# is built against, and that dummynet.ko's SHA256. The module is compiled
# from SRC_COMMIT's headers, so the three must match: when OPNsense ships
# a different dummynet.ko (the opnsense-watch workflow opens an issue),
# move SRC_COMMIT to that kernel's source and update both lines together.
KSET=kernel-26.7.8-amd64.txz
DUMMYNET_SHA256=9e41ffead509b7234d57cc8e1cb4e25596674712a9c3ba520dac5b4cd77200dc
