[retry]
command:/bin/rm -f /conf/dummynet-st.loading /conf/dummynet-st.active /conf/dummynet-st.unclean /conf/dummynet-st.held /var/run/dummynet-st.checked
parameters:
type:script
message:let the CAKE wrapper load dummynet-st again after a crash

[status]
command:/usr/local/opnsense/scripts/cake/status.py
parameters:
type:script_output
message:request CAKE status
